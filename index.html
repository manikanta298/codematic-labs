<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Codematic Labs builds business software, websites, mobile apps and AI tools. Explore services, software solutions and simple workflow examples." />
    <meta name="author" content="Codematic Labs" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Codematic Labs</title>
    <script>
      document.documentElement.classList.add('logo-loader-enabled');
      window.logoLoaderStartedAt = Date.now();
      window.logoLoaderSafetyTimer = setTimeout(function () {
        document.documentElement.classList.remove('logo-loader-enabled');
        var loader = document.getElementById('site-loader');
        if (loader) loader.remove();
      }, 8000);
    </script>
    <style id="logo-loader-styles">
/* Exact uploaded 3000 × 2000 logo; visible bounds: 565,452–2435,1377. */
.cl-loader{position:fixed;inset:0;z-index:9999;display:none;place-items:center;background:#000;overflow:hidden;opacity:1;transition:opacity .55s ease}
.cl-loader.is-leaving{opacity:0;pointer-events:none}
.cl-scene{position:relative;width:min(680px,86vw,130vh);width:min(680px,86vw,130svh);aspect-ratio:1870/925;isolation:isolate}
.cl-layer{position:absolute;inset:0;pointer-events:none}
.cl-layer img{position:absolute;display:block;width:160.427807%;max-width:none;height:auto;left:-30.213904%;top:-48.864865%}
.cl-outline{clip-path:inset(0 0 27% 0);animation:cl-trace 1.15s cubic-bezier(.4,0,.2,1) both,cl-outline-out .5s ease 1.25s forwards}
.cl-symbol{clip-path:inset(0 0 27% 0);animation:cl-fill 1.3s cubic-bezier(.16,1,.3,1) .65s both}
.cl-wordmark{clip-path:inset(73% 100% 7% 0);animation:cl-wordmark 1.35s cubic-bezier(.16,1,.3,1) 1.65s both}
.cl-tagline{clip-path:inset(93% 0 0 0);animation:cl-tagline .85s ease 2.65s both}
.cl-sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;clip-path:inset(0)}
.cl-sheen:after{content:"";position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 44%,#ffffff12 50%,transparent 56%);transform:translateX(-110%);animation:cl-sheen 1.1s ease 3s both}
.cl-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes cl-trace{from{clip-path:inset(0 0 100% 0);opacity:0;transform:translateY(3%)}to{clip-path:inset(0 0 27% 0);opacity:.8;transform:none}}
@keyframes cl-outline-out{to{opacity:0}}
@keyframes cl-fill{from{opacity:0;transform:translateY(3%) scale(1.04);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes cl-wordmark{from{clip-path:inset(73% 100% 7% 0);opacity:0;transform:translateY(2%)}to{clip-path:inset(73% 0 7% 0);opacity:1;transform:none}}
@keyframes cl-tagline{from{opacity:0;transform:translateY(2%)}to{opacity:1;transform:none}}
@keyframes cl-sheen{to{transform:translateX(110%)}}
@media(prefers-reduced-motion:reduce){.cl-layer{animation:none;transform:none;filter:none}.cl-outline,.cl-sheen{display:none}.cl-symbol{opacity:1}.cl-wordmark{clip-path:inset(73% 0 7% 0);opacity:1}.cl-tagline{opacity:1}.cl-loader{transition-duration:.1s}}

.logo-loader-enabled .cl-loader{display:grid}
    </style>
    <script src="/logo-loader.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Open+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <noscript><style>[data-reveal], .word-reveal-item { opacity: 1 !important; transform: none !important; }</style></noscript>
  </head>
  <body>
    <div id="site-loader" class="logo-loader cl-loader" role="status" aria-label="Loading Codematic Labs" aria-live="polite"><span class="cl-status">Loading website. Please wait.</span><div class="cl-scene" aria-hidden="true"><div class="cl-layer cl-outline"><img class="logo-loader__image" src="/src/assets/logo-outline.png" alt="" width="3000" height="2000" decoding="async" /></div><div class="cl-layer cl-symbol"><img class="logo-loader__image" src="/src/assets/logo white.png" alt="" width="3000" height="2000" decoding="async" /></div><div class="cl-layer cl-wordmark"><img class="logo-loader__image" src="/src/assets/logo white.png" alt="" width="3000" height="2000" decoding="async" /></div><div class="cl-layer cl-tagline"><img class="logo-loader__image" src="/src/assets/logo white.png" alt="" width="3000" height="2000" decoding="async" /></div><div class="cl-sheen"></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
